<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="estilos/botóniniciosesión.css">
</head>

<body>

    <h1>Iniciar sesión</h1>

    <!-- Se quita novalidate para activar las alertas del navegador -->
    <form id="iniciosesiónForm" action="#" method="POST" autocomplete="off">

        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ejemplo: juan123"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ0-9_]{4,20}" title="Entre 4 y 20 caracteres." required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
            pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" title="Mínimo 8 caracteres, al menos una letra y un número" required>
        
        <button type="submit">Iniciar sesión</button>

    </form>

    <script src="js/iniciosesión.js"></script>

</body>

</html>
