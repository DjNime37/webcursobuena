<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>
    <style>
        body{
            margin:0;
            padding:20px;
            font-family:Arial,sans-serif;
            background:#f5f5f5;
        }

        h2{
            text-align:center;
            margin-bottom:30px;
        }

        .galeria{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .galeria img{
            width:100%;
            height:320px;
            object-fit:contain;
            background:#fff;
            border:1px solid #ccc;
            border-radius:8px;
        }
    </style>
</head>
<body>

<h2>Catálogo de Productos</h2>

<div class="galeria">
    <img src="imagenes/ropa1.jpg" alt="Producto 1">
    <img src="imagenes/ropa2.jpg" alt="Producto 2">
    <img src="imagenes/ropa3.jpg" alt="Producto 3">
    <img src="imagenes/ropa4.jpg" alt="Producto 4">
    <img src="imagenes/ropa5.jpg" alt="Producto 5">
</div>

</body>
</html>
